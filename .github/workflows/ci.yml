
name: CI

on:
  push:
    branches:
      - main
      - 'feature/**'
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Production build
        run: npm run build

  backend:
    name: Backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend/website-backend

    env:
      SPRING_DATASOURCE_URL: jdbc:mysql://127.0.0.1:3306/saiteja_website
      SPRING_DATASOURCE_USERNAME: root
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}

    services:
      mysql:
        image: mysql:8
        env:
          MYSQL_DATABASE: saiteja_website
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -p$${MYSQL_ROOT_PASSWORD} --silent"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=15
          --health-start-period=60s

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
          cache-dependency-path: backend/website-backend/pom.xml

      - name: Make Maven wrapper executable
        run: chmod +x mvnw

      - name: Test with Maven Wrapper
        run: ./mvnw -B test

  sonarqube:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install frontend dependencies
        run: npm ci

      - name: SonarQube Scan
        uses: SonarSource/sonarqube-scan-action@v5
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          args: >
            -Dsonar.projectKey=Vaibha3246_devsecops-cicd-pipeline
            -Dsonar.organization=vaibha3246

      - name: SonarQube Quality Gate
        uses: SonarSource/sonarqube-quality-gate-action@v1
        timeout-minutes: 5
        with:
         pollingTimeoutSec: 240
        env:
         SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}    
  

  
  docker-security:
    name: Docker Compose Build and Security
    runs-on: ubuntu-latest

    env:
      IMAGE_TAG: ${{ github.sha }}
      MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
      SPRING_DATASOURCE_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate Compose Configuration
        run: docker compose config --quiet

      - name: Build Frontend and Backend Images
        run: docker compose build

      - name: Inspect Backend Image
        run: |
          docker image inspect "saiteja-backend:${GITHUB_SHA}" \
            --format 'Image={{.Config.Image}} OS={{.Os}} Architecture={{.Architecture}}'

      - name: Scan Backend Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: saiteja-backend:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'
      
      - name: Scan Frontend Image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: saiteja-frontend:${{ github.sha }}
          format: table
          vuln-type: os,library
          severity: HIGH,CRITICAL
          exit-code: '1'


      - name: Start All Services
        run: docker compose up -d

      - name: Verify Services
        run: docker compose ps

      - name: Wait for Frontend
        run: |
          for i in {1..30}; do
            if curl --fail --silent http://localhost/ > /dev/null; then
              echo "Frontend is responding."
              exit 0
            fi
            sleep 5
          done
          echo "Frontend did not become ready."
          exit 1

      - name: Verify Frontend HTTP Response
        run: curl --fail --show-error --silent http://localhost/ -o /dev/null

      - name: Show Logs on Failure
        if: failure()
        run: docker compose logs

      - name: Stop Services
        if: always()
        run: docker compose down -v